[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionssearch"
version = "0.1.0"
description = "Hybrid memory server for AI agents — MCP server, shared team memory, and autonomous error investigator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "qdrant-client>=1.13,<1.15",
    "fastembed>=0.8,<0.9",
    "neo4j>=5.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "instructor>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
decisionssearch = "decisionssearch.interfaces.http.asgi:main"
decisionssearch-mcp = "decisionssearch.interfaces.mcp.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[tool.setuptools]
package-dir = { decisionssearch = "src" }
packages = [
    "decisionssearch",
    "decisionssearch.application",
    "decisionssearch.application.agents",
    "decisionssearch.application.catalog",
    "decisionssearch.application.error_investigation",
    "decisionssearch.application.governance",
    "decisionssearch.application.jobs",
    "decisionssearch.application.memory",
    "decisionssearch.application.memory.ledger",
    "decisionssearch.application.notifications",
    "decisionssearch.application.ports",
    "decisionssearch.application.pr_memory",
    "decisionssearch.application.search",
    "decisionssearch.application.shared",
    "decisionssearch.bootstrap",
    "decisionssearch.domain",
    "decisionssearch.domain.catalog",
    "decisionssearch.domain.episodic",
    "decisionssearch.domain.incidents",
    "decisionssearch.domain.memory",
    "decisionssearch.domain.memory_ledger",
    "decisionssearch.domain.pr_memory",
    "decisionssearch.domain.procedural",
    "decisionssearch.domain.shared",
    "decisionssearch.infrastructure",
    "decisionssearch.infrastructure.agents",
    "decisionssearch.infrastructure.ai",
    "decisionssearch.infrastructure.ai.embeddings",
    "decisionssearch.infrastructure.ai.providers",
    "decisionssearch.infrastructure.ai.reranking",
    "decisionssearch.infrastructure.config",
    "decisionssearch.infrastructure.integrations",
    "decisionssearch.infrastructure.integrations.notifications",
    "decisionssearch.infrastructure.persistence",
    "decisionssearch.infrastructure.persistence.neo4j",
    "decisionssearch.infrastructure.persistence.qdrant",
    "decisionssearch.interfaces",
    "decisionssearch.interfaces.http",
    "decisionssearch.interfaces.http.routes",
    "decisionssearch.interfaces.http.schemas",
    "decisionssearch.interfaces.mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
